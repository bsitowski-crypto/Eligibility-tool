<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183153">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solvita Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Solvita Recovery Planner</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f7;color:#071f3e;padding:24px}.load{max-width:560px;margin:80px auto;background:#fff;border-radius:16px;padding:24px;text-align:center}</style>
</head><body><div class="load"><h2>Solvita Recovery Planner</h2><p>Loading…</p></div>
<script>
(async()=>{
 const files=["app/data-1.b64", "app/data-2.b64", "app/data-3.b64"];
 try{
  const text=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+" "+r.status);return r.text()})))).join("");
  const bin=atob(text.trim()), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(err){document.body.innerHTML='<div class="load"><h2>Unable to load planner</h2><p>'+String(err)+'</p></div>'}
})();
</script></body></html>
