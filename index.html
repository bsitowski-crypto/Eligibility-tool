<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183153">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solvita Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Solvita Recovery Planner</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#071f3e;padding:24px;margin:0;min-height:100vh;box-sizing:border-box}
.card{max-width:560px;margin:80px auto;background:#fff;border-radius:18px;padding:26px;box-sizing:border-box;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.06)}
h2{margin:0 0 12px;font-size:28px}.small{font-size:13px;color:#666;word-break:break-word}.lock-note{font-size:15px;color:#56606d;margin:0 0 18px}
input{width:100%;box-sizing:border-box;border:1px solid #cfd5dc;border-radius:12px;padding:14px 16px;font-size:22px;text-align:center;letter-spacing:2px;margin:4px 0 12px;background:#fff;color:#071f3e}
button{width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;background:#183153;color:#fff;min-height:48px}
#error{min-height:20px;color:#b42318;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const PASSWORD_HASH="a32b36028c0b1ceea96d2b394510645e1c1c6796b270c4253a96933b0ba378d6";
const SESSION_KEY="solvita_planner_unlocked_v1";
function showLogin(){
 document.getElementById("root").innerHTML=`<div class="card"><h2>Solvita Recovery Planner</h2><p class="lock-note">Enter the access password to continue.</p><form id="loginForm"><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Password" placeholder="Password"><button type="submit">UNLOCK</button><div id="error"></div></form></div>`;
 const form=document.getElementById("loginForm"), pw=document.getElementById("pw"), err=document.getElementById("error");
 setTimeout(()=>pw.focus(),150);
 form.addEventListener("submit",async e=>{
   e.preventDefault(); err.textContent="";
   try{
     const bytes=new TextEncoder().encode(pw.value);
     const digest=await crypto.subtle.digest("SHA-256",bytes);
     const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
     if(hash!==PASSWORD_HASH){ err.textContent="Incorrect password."; pw.value=""; pw.focus(); return; }
     sessionStorage.setItem(SESSION_KEY,"1");
     loadPlanner();
   }catch(ex){ err.textContent="Unable to verify password on this browser."; }
 });
}
async function loadPlanner(){
 document.getElementById("root").innerHTML='<div class="card"><h2>Solvita Recovery Planner</h2><p>Loading…</p></div>';
 const files=["app/data-1.b64","app/data-2.b64","app/data-3.b64"];
 try{
   const parts=await Promise.all(files.map(async f=>{
     const r=await fetch(f,{cache:"no-store"});
     if(!r.ok) throw new Error(f+" returned "+r.status);
     return (await r.text()).replace(/\s+/g,"");
   }));
   const b64=parts.join("");
   if(b64.length%4!==0) throw new Error("Planner data length is invalid: "+b64.length);
   const bin=atob(b64);
   const bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
   if(typeof DecompressionStream==="undefined") throw new Error("This Safari version does not support the required decompression feature.");
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
   let html=await new Response(stream).text();
   const cloudTag="<scr"+"ipt src=\"./cloud-sync.js?v=9103\"></scr"+"ipt>";
   html=html.replace("</body>",cloudTag+"</body>");
   if(!html || !html.includes("<html")) throw new Error("Planner decoded but did not contain a valid HTML document.");
   document.open(); document.write(html); document.close();
 }catch(err){
   document.body.innerHTML='<div class="card"><h2>Unable to load planner</h2><p class="small">'+String(err)+'</p><p class="small">Send me the error text shown above.</p></div>';
 }
}
if(sessionStorage.getItem(SESSION_KEY)==="1") loadPlanner(); else showLogin();
</script>
</body>
</html>
